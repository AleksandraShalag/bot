name: Daily vacancy fetch & schedule

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: vacancy-bot-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch and schedule posts
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python main.py

      - name: Commit updated seen_ids
        run: |
          git config user.name "vacancy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_ids.json
          if git diff --cached --quiet; then
            echo "Нет изменений — пропускаем коммит"
            exit 0
          fi
          git commit -m "chore: update seen vacancy ids [skip ci]"
          git stash -u || true
          git pull --rebase origin main
          git stash pop || true
          git push origin main
