name: Daily vacancy fetch & post

on:
  schedule:
    # 08:00 UTC каждый день (поправьте под нужный часовой пояс)
    - cron: "0 8 * * *"
  workflow_dispatch: {}   # позволяет запускать вручную из вкладки Actions

permissions:
  contents: write   # нужно, чтобы коммитить обновлённый state.json обратно в репо

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fetcher & post to Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name "vacancy-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update posted vacancies state [skip ci]"
          git push origin main
