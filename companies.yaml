# Список компаний, вакансии которых собираем через официальный API
# «Работа в России» (opendata.trudvsem.ru).
#
# Чтобы добавить компанию — впишите её ИНН (или ОГРН, если ИНН неизвестен).
# Найти ИНН компании можно на nalog.ru (сервис "Прозрачный бизнес") или просто
# поиском "ИНН <название компании>".
#
# id_type: "inn"  -> используется /vacancies/company/inn/{id}
# id_type: "ogrn" -> используется /vacancies/company/ogrn/{id}

- name: "Пример компании 1"
  id_type: "inn"
  id: "7707083893"     # ИНН для примера (Сбербанк) — замените на реальные

- name: "Пример компании 2"
  id_type: "inn"
  id: "1657021419"     # замените на реальный ИНН

